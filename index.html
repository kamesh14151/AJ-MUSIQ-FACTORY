<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJ MUSIQ FACTORY</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #6c5ce7;
            --secondary-color: #a29bfe;
            --text-color: #f5f6fa;
            --bg-color: #2d3436;
            --card-bg: rgba(45, 52, 54, 0.7);
            --progress-color: var(--primary-color);
            --volume-color: var(--secondary-color);
            --gradient-angle: 135deg;
        }

        /* Theme Variables */
        .theme-default {
            --primary-color: #6c5ce7;
            --secondary-color: #a29bfe;
            --text-color: #f5f6fa;
            --bg-color: #2d3436;
            --card-bg: rgba(45, 52, 54, 0.7);
        }

        .theme-dark {
            --primary-color: #e84393;
            --secondary-color: #fd79a8;
            --text-color: #f5f6fa;
            --bg-color: #1e272e;
            --card-bg: rgba(30, 39, 46, 0.7);
        }

        .theme-ocean {
            --primary-color: #0984e3;
            --secondary-color: #74b9ff;
            --text-color: #f5f6fa;
            --bg-color: #0a3d62;
            --card-bg: rgba(10, 61, 98, 0.7);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.5s ease;
            overflow: hidden;
        }

        .dynamic-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: linear-gradient(var(--gradient-angle), var(--primary-color) 0%, var(--bg-color) 70%);
            opacity: 0.5;
            animation: gradientShift 15s ease infinite alternate;
        }

        @keyframes gradientShift {
            0% { --gradient-angle: 135deg; }
            25% { --gradient-angle: 90deg; }
            50% { --gradient-angle: 45deg; }
            75% { --gradient-angle: 0deg; }
            100% { --gradient-angle: -45deg; }
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            pointer-events: none;
            filter: blur(1px);
        }

        .theme-selector {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }

        .theme-option {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid white;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .theme-option:hover {
            transform: scale(1.1);
            box-shadow: 0 0 10px white;
        }

        .theme-option[data-theme="default"] {
            background: #6c5ce7;
        }

        .theme-option[data-theme="dark"] {
            background: #e84393;
        }

        .theme-option[data-theme="ocean"] {
            background: #0984e3;
        }

        .music-player {
            background-color: var(--card-bg);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            padding: 30px;
            width: 420px;
            max-width: 95%;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.5s ease;
            position: relative;
            overflow: hidden;
        }

        .music-player::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.5s;
            z-index: -1;
        }

        .music-player:hover::before {
            opacity: 0.3;
        }

        .loading-spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: var(--primary-color);
            animation: spin 1s ease-in-out infinite;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 10;
        }

        @keyframes spin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .loading .loading-spinner {
            opacity: 1;
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .player-header h1 {
            font-size: 1.8rem;
            font-weight: 600;
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 10px rgba(108, 92, 231, 0.3);
        }

        .visualizer-container {
            width: 100%;
            height: 80px;
            margin: 20px 0;
            position: relative;
        }

        .spectrum-visualizer {
            display: flex;
            align-items: flex-end;
            height: 100%;
            gap: 2px;
        }

        .spectrum-bar {
            flex: 1;
            background: linear-gradient(to top, var(--primary-color), var(--secondary-color));
            border-radius: 3px;
            min-height: 2px;
            transform-origin: bottom;
            transition: transform 0.1s ease-out;
        }

        .waveform-progress {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0%;
            height: 3px;
            background: white;
            border-radius: 3px;
            box-shadow: 0 0 10px white;
            z-index: 2;
        }

        .song-info {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
            align-items: center;
            transition: all 0.5s ease;
            position: relative;
        }

        .song-change {
            opacity: 0;
            transform: translateY(20px);
        }

        .album-art-container {
            position: relative;
            width: 150px;
            height: 150px;
            flex-shrink: 0;
            perspective: 1000px;
            transform-style: preserve-3d;
        }

        .album-art {
            width: 100%;
            height: 100%;
            border-radius: 10px;
            object-fit: cover;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            transition: all 0.5s ease;
            transform-style: preserve-3d;
            backface-visibility: hidden;
        }

        .album-art.flip {
            animation: flipAlbum 1s ease;
        }

        @keyframes flipAlbum {
            0% { transform: rotateY(0deg); }
            50% { transform: rotateY(90deg); }
            100% { transform: rotateY(0deg); }
        }

        .vinyl-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="white" stroke-width="0.5" opacity="0.3"/><circle cx="50" cy="50" r="10" fill="none" stroke="white" stroke-width="0.5" opacity="0.5"/></svg>') center/cover no-repeat;
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .playing .album-art {
            border-radius: 50%;
            animation: rotate 20s linear infinite;
        }

        .playing .vinyl-overlay {
            opacity: 1;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .song-details {
            flex-grow: 1;
            overflow: hidden;
        }

        .song-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            position: relative;
        }

        .song-title::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(to right, var(--primary-color), transparent);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.3s;
        }

        .song-title:hover::after {
            transform: scaleX(1);
        }

        .artist, .album {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .progress-container {
            margin: 25px 0;
            transition: all 0.5s ease;
        }

        .progress-bar {
            height: 6px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            margin-bottom: 5px;
        }

        .progress-fill {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 0%;
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            border-radius: 3px;
            transition: width 0.1s linear;
        }

        .progress-thumb {
            position: absolute;
            left: 0%;
            top: 50%;
            width: 12px;
            height: 12px;
            background: white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: opacity 0.2s;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
        }

        .progress-bar:hover .progress-thumb {
            opacity: 1;
        }

        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 30px 0;
            transition: all 0.5s ease;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .control-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 70%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .control-btn:hover::after {
            opacity: 0.4;
        }

        .control-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        .control-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, var(--primary-color), var(--secondary-color));
            opacity: 0;
            transition: opacity 0.3s;
            z-index: -1;
        }

        .control-btn:hover::before {
            opacity: 1;
        }

        #play-btn {
            width: 60px;
            height: 60px;
            font-size: 1.5rem;
            background: linear-gradient(to bottom, var(--primary-color), var(--secondary-color));
            box-shadow: 0 0 20px var(--primary-color);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 15px var(--primary-color); }
            50% { box-shadow: 0 0 30px var(--primary-color); }
            100% { box-shadow: 0 0 15px var(--primary-color); }
        }

        #play-btn:hover {
            transform: scale(1.1);
            animation: none;
            box-shadow: 0 0 25px var(--primary-color);
        }

        .control-btn.active {
            background: linear-gradient(to bottom, var(--primary-color), var(--secondary-color)) !important;
            color: white !important;
            box-shadow: 0 0 15px var(--primary-color);
        }

        .extras {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            transition: all 0.5s ease;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 60%;
        }

        .volume-control i {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.7);
            transition: color 0.3s;
        }

        .volume-control:hover i {
            color: white;
            text-shadow: 0 0 5px white;
        }

        #volume-slider {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            outline: none;
            transition: all 0.3s;
            -webkit-appearance: none;
        }

        #volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: white;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 5px white;
        }

        #volume-slider:hover {
            height: 6px;
        }

        #volume-slider:hover::-webkit-slider-thumb {
            width: 15px;
            height: 15px;
        }

        .extra-controls {
            display: flex;
            gap: 10px;
        }

        .lyrics-btn, .sleep-timer-btn, .equalizer-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .lyrics-btn::after, .sleep-timer-btn::after, .equalizer-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 70%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .lyrics-btn:hover::after, .sleep-timer-btn:hover::after, .equalizer-btn:hover::after {
            opacity: 0.3;
        }

        .lyrics-btn:hover, .sleep-timer-btn:hover, .equalizer-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .social-share {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            justify-content: center;
        }

        .share-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .share-btn:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.2);
        }

        #twitter-share:hover {
            background: #1DA1F2;
        }

        #facebook-share:hover {
            background: #4267B2;
        }

        #copy-link:hover {
            background: var(--primary-color);
        }

        .playlist-container {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            padding: 15px;
        }

        .playlist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .playlist-header h3 {
            font-size: 1.1rem;
            font-weight: 500;
        }

        .playlist-actions {
            display: flex;
            gap: 10px;
        }

        .playlist-actions button {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.3s;
        }

        .playlist-actions button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .playlist-sort {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
        }

        .sort-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            padding: 3px 8px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.6rem;
            transition: all 0.3s;
        }

        .sort-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .sort-btn.active {
            background: var(--primary-color);
        }

        .playlist-scroll {
            max-height: 200px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .playlist {
            list-style: none;
        }

        .playlist li {
            padding: 10px 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        .playlist li:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .playlist li.playing {
            background: linear-gradient(to right, rgba(108, 92, 231, 0.3), transparent);
            color: var(--primary-color);
            font-weight: 500;
        }

        .playlist li .song-info-container {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }

        .playlist li .song-thumbnail {
            width: 30px;
            height: 30px;
            border-radius: 5px;
            object-fit: cover;
        }

        .playlist li .song-details {
            flex: 1;
            min-width: 0;
        }

        .playlist li .song-name {
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .playlist li .song-artist {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.6);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .playlist li .song-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .playlist li .song-duration {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.5);
        }

        .playlist li .favorite-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: all 0.3s;
        }

        .playlist li .favorite-btn:hover {
            color: gold;
            transform: scale(1.1);
        }

        .playlist li .favorite-btn.favorited {
            color: gold;
        }

        .lyrics-modal, .sleep-timer-modal, .equalizer-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .lyrics-modal.active, .sleep-timer-modal.active, .equalizer-modal.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
            width: 80%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.3s;
        }

        .close-modal:hover {
            color: var(--primary-color);
        }

        .modal-content h3 {
            margin-bottom: 20px;
            text-align: center;
            color: var(--primary-color);
        }

        .lyrics-text {
            white-space: pre-line;
            line-height: 1.6;
            text-align: center;
        }

        .timer-options {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .timer-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .timer-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .timer-btn.active {
            background: var(--primary-color);
        }

        .equalizer-presets {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }

        .preset-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
        }

        .preset-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .preset-btn.active {
            background: var(--primary-color);
        }

        .notification {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary-color);
            color: white;
            padding: 12px 25px;
            border-radius: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .notification.show {
            opacity: 1;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        @media (max-width: 768px) {
            .music-player {
                width: 95%;
                padding: 20px;
            }
            
            .song-info {
                flex-direction: column;
                text-align: center;
            }
            
            .album-art-container {
                margin-bottom: 15px;
            }
            
            .controls {
                gap: 10px;
            }
            
            .control-btn {
                width: 45px;
                height: 45px;
            }
            
            #play-btn {
                width: 55px;
                height: 55px;
            }
        }
    </style>
</head>
<body>
    <div class="dynamic-bg"></div>
    <div class="theme-selector">
        <div class="theme-option" data-theme="default"></div>
        <div class="theme-option" data-theme="dark"></div>
        <div class="theme-option" data-theme="ocean"></div>
    </div>

    <div class="music-player">
        <div class="loading-spinner"></div>
        
        <div class="player-header">
            <h1>AJ MUSIQ FACTORY</h1>
            <div class="visualizer-container">
                <div class="spectrum-visualizer" id="spectrum-visualizer"></div>
                <div class="waveform-progress" id="waveform-progress"></div>
            </div>
        </div>

        <div class="song-info">
            <div class="album-art-container">
                <img src="AJLOGO.jpg" alt="Album Art" class="album-art" id="album-art">
                <div class="vinyl-overlay"></div>
            </div>
            <div class="song-details">
                <h2 class="song-title" id="song-title">No song selected</h2>
                <p class="artist" id="artist">Artist</p>
                <p class="album" id="album">Album</p>
            </div>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
                <div class="progress-thumb" id="progress-thumb"></div>
            </div>
            <div class="time-info">
                <span class="current-time" id="current-time">0:00</span>
                <span class="duration" id="duration">0:00</span>
            </div>
        </div>

        <div class="controls">
            <button class="control-btn" id="shuffle-btn" title="Shuffle">
                <i class="fas fa-random"></i>
            </button>
            <button class="control-btn" id="prev-btn" title="Previous">
                <i class="fas fa-step-backward"></i>
            </button>
            <button class="control-btn" id="play-btn" title="Play">
                <i class="fas fa-play"></i>
            </button>
            <button class="control-btn" id="next-btn" title="Next">
                <i class="fas fa-step-forward"></i>
            </button>
            <button class="control-btn" id="repeat-btn" title="Repeat">
                <i class="fas fa-redo"></i>
            </button>
        </div>

        <div class="extras">
            <div class="volume-control">
                <i class="fas fa-volume-down" id="volume-icon"></i>
                <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.7">
                <i class="fas fa-volume-up"></i>
            </div>
            <div class="extra-controls">
                <button class="lyrics-btn" id="lyrics-btn">
                    <i class="fas fa-align-left"></i> Lyrics
                </button>
                <button class="sleep-timer-btn" id="sleep-timer-btn">
                    <i class="fas fa-clock"></i> Timer
                </button>
                <button class="equalizer-btn" id="equalizer-btn">
                    <i class="fas fa-sliders-h"></i> EQ
                </button>
            </div>
        </div>

        <div class="social-share">
            <button class="share-btn" id="twitter-share" title="Share on Twitter">
                <i class="fab fa-twitter"></i>
            </button>
            <button class="share-btn" id="facebook-share" title="Share on Facebook">
                <i class="fab fa-facebook-f"></i>
            </button>
            <button class="share-btn" id="copy-link" title="Copy song link">
                <i class="fas fa-link"></i>
            </button>
        </div>

        <div class="playlist-container">
            <div class="playlist-header">
                <h3>Playlist</h3>
                <div class="playlist-actions">
                    <button id="add-files-btn">
                        <i class="fas fa-plus"></i> Add Files
                    </button>
                    <button id="clear-playlist-btn">
                        <i class="fas fa-trash"></i> Clear
                    </button>
                </div>
            </div>
            <div class="playlist-sort">
                <button class="sort-btn" data-sort="title">Title</button>
                <button class="sort-btn" data-sort="artist">Artist</button>
                <button class="sort-btn" data-sort="duration">Duration</button>
            </div>
            <input type="file" id="file-input" multiple accept="audio/*" style="display: none;">
            <div class="playlist-scroll">
                <ul class="playlist" id="playlist"></ul>
            </div>
        </div>

        <!-- Modals -->
        <div class="lyrics-modal">
            <div class="modal-content">
                <span class="close-modal">&times;</span>
                <h3>Lyrics</h3>
                <div class="lyrics-text" id="lyrics-text">No lyrics available</div>
            </div>
        </div>

        <div class="sleep-timer-modal">
            <div class="modal-content">
                <span class="close-modal">&times;</span>
                <h3>Sleep Timer</h3>
                <p>Stop playback after:</p>
                <div class="timer-options">
                    <button class="timer-btn" data-minutes="5">5 min</button>
                    <button class="timer-btn" data-minutes="15">15 min</button>
                    <button class="timer-btn" data-minutes="30">30 min</button>
                    <button class="timer-btn" data-minutes="60">60 min</button>
                    <button class="timer-btn" id="cancel-timer">Cancel</button>
                </div>
            </div>
        </div>

        <div class="equalizer-modal">
            <div class="modal-content">
                <span class="close-modal">&times;</span>
                <h3>Equalizer</h3>
                <div class="equalizer-presets">
                    <button class="preset-btn" data-preset="flat">Flat</button>
                    <button class="preset-btn" data-preset="pop">Pop</button>
                    <button class="preset-btn" data-preset="rock">Rock</button>
                    <button class="preset-btn" data-preset="jazz">Jazz</button>
                    <button class="preset-btn" data-preset="classical">Classical</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // DOM Elements
            const audio = new Audio();
            const playBtn = document.getElementById('play-btn');
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            const shuffleBtn = document.getElementById('shuffle-btn');
            const repeatBtn = document.getElementById('repeat-btn');
            const volumeSlider = document.getElementById('volume-slider');
            const volumeIcon = document.getElementById('volume-icon');
            const progressBar = document.getElementById('progress-bar');
            const progressFill = document.getElementById('progress-fill');
            const progressThumb = document.getElementById('progress-thumb');
            const currentTimeEl = document.getElementById('current-time');
            const durationEl = document.getElementById('duration');
            const songTitle = document.getElementById('song-title');
            const artistEl = document.getElementById('artist');
            const albumEl = document.getElementById('album');
            const albumArt = document.getElementById('album-art');
            const playlistEl = document.getElementById('playlist');
            const fileInput = document.getElementById('file-input');
            const addFilesBtn = document.getElementById('add-files-btn');
            const clearPlaylistBtn = document.getElementById('clear-playlist-btn');
            const lyricsBtn = document.getElementById('lyrics-btn');
            const lyricsModal = document.querySelector('.lyrics-modal');
            const lyricsText = document.getElementById('lyrics-text');
            const sleepTimerBtn = document.getElementById('sleep-timer-btn');
            const sleepTimerModal = document.querySelector('.sleep-timer-modal');
            const equalizerBtn = document.getElementById('equalizer-btn');
            const equalizerModal = document.querySelector('.equalizer-modal');
            const timerOptions = document.querySelectorAll('.timer-btn');
            const cancelTimerBtn = document.getElementById('cancel-timer');
            const equalizerPresets = document.querySelectorAll('.preset-btn');
            const sortButtons = document.querySelectorAll('.sort-btn');
            const spectrumVisualizer = document.getElementById('spectrum-visualizer');
            const waveformProgress = document.getElementById('waveform-progress');
            const themeOptions = document.querySelectorAll('.theme-option');
            const playerContainer = document.querySelector('.music-player');
            const twitterShareBtn = document.getElementById('twitter-share');
            const facebookShareBtn = document.getElementById('facebook-share');
            const copyLinkBtn = document.getElementById('copy-link');
            const dynamicBg = document.querySelector('.dynamic-bg');
            
            // Player state
            let isPlaying = false;
            let currentSongIndex = 0;
            let songs = [];
            let isShuffled = false;
            let isRepeated = false;
            let originalPlaylistOrder = [];
            let audioContext;
            let analyser;
            let dataArray;
            let animationId;
            let sleepTimer = null;
            let currentSort = 'title';
            let favorites = JSON.parse(localStorage.getItem('favorites')) || [];
            
            // Initialize visualizer bars
            for (let i = 0; i < 32; i++) {
                const bar = document.createElement('div');
                bar.className = 'spectrum-bar';
                bar.style.setProperty('--i', i);
                spectrumVisualizer.appendChild(bar);
            }
            const visualizerBars = document.querySelectorAll('.spectrum-bar');
            
            // Initialize player
            function initPlayer() {
                setupEventListeners();
                setupAudioContext();
                loadTheme();
                createParticles();
                loadFavorites();
            }
            
            function createParticles() {
                for (let i = 0; i < 30; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'particle';
                    particle.style.width = `${Math.random() * 15 + 5}px`;
                    particle.style.height = particle.style.width;
                    particle.style.left = `${Math.random() * 100}%`;
                    particle.style.top = `${Math.random() * 100}%`;
                    dynamicBg.appendChild(particle);
                    
                    animateParticle(particle);
                }
            }

            function animateParticle(particle) {
                let x = parseFloat(particle.style.left);
                let y = parseFloat(particle.style.top);
                let xSpeed = (Math.random() - 0.5) * 0.2;
                let ySpeed = (Math.random() - 0.5) * 0.2;

                function move() {
                    x += xSpeed;
                    y += ySpeed;
                    
                    if (x > 100 || x < 0) xSpeed *= -1;
                    if (y > 100 || y < 0) ySpeed *= -1;
                    
                    particle.style.left = `${x}%`;
                    particle.style.top = `${y}%`;
                    
                    requestAnimationFrame(move);
                }
                
                move();
            }
            
            function setupEventListeners() {
                // Button events
                playBtn.addEventListener('click', togglePlay);
                prevBtn.addEventListener('click', prevSong);
                nextBtn.addEventListener('click', nextSong);
                shuffleBtn.addEventListener('click', toggleShuffle);
                repeatBtn.addEventListener('click', toggleRepeat);
                volumeSlider.addEventListener('input', setVolume);
                addFilesBtn.addEventListener('click', () => fileInput.click());
                clearPlaylistBtn.addEventListener('click', clearPlaylist);
                lyricsBtn.addEventListener('click', () => toggleModal(lyricsModal));
                sleepTimerBtn.addEventListener('click', () => toggleModal(sleepTimerModal));
                equalizerBtn.addEventListener('click', () => toggleModal(equalizerModal));
                twitterShareBtn.addEventListener('click', shareOnTwitter);
                facebookShareBtn.addEventListener('click', shareOnFacebook);
                copyLinkBtn.addEventListener('click', copySongLink);
                
                // Modal close buttons
                document.querySelectorAll('.close-modal').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const modal = this.closest('.modal-content').parentElement;
                        toggleModal(modal);
                    });
                });
                
                // Timer options
                timerOptions.forEach(option => {
                    option.addEventListener('click', setSleepTimer);
                });
                cancelTimerBtn.addEventListener('click', cancelSleepTimer);
                
                // Equalizer presets
                equalizerPresets.forEach(preset => {
                    preset.addEventListener('click', setEqualizerPreset);
                });
                
                // Sort buttons
                sortButtons.forEach(btn => {
                    btn.addEventListener('click', sortPlaylist);
                });
                
                // Progress bar events
                progressBar.addEventListener('click', setProgress);
                progressBar.addEventListener('mousemove', showProgressThumb);
                progressBar.addEventListener('mouseleave', hideProgressThumb);
                
                // File input event
                fileInput.addEventListener('change', handleFileUpload);
                
                // Audio events
                audio.addEventListener('timeupdate', updateProgress);
                audio.addEventListener('ended', handleSongEnd);
                audio.addEventListener('loadedmetadata', updateSongInfo);
                audio.addEventListener('play', updateVisualizer);
                audio.addEventListener('pause', cancelVisualizer);
                
                // Theme events
                themeOptions.forEach(option => {
                    option.addEventListener('click', () => setTheme(option.dataset.theme));
                });
            }
            
            function setupAudioContext() {
                try {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    analyser = audioContext.createAnalyser();
                    analyser.fftSize = 256;
                    const source = audioContext.createMediaElementSource(audio);
                    source.connect(analyser);
                    analyser.connect(audioContext.destination);
                    dataArray = new Uint8Array(analyser.frequencyBinCount);
                } catch (e) {
                    console.error('Audio Context not supported', e);
                }
            }
            
            function updateVisualizer() {
                if (!analyser) return;
                
                analyser.getByteFrequencyData(dataArray);
                
                // Update spectrum visualizer
                visualizerBars.forEach((bar, i) => {
                    const value = dataArray[i] / 255;
                    const height = value * 50;
                    bar.style.transform = `scaleY(${0.2 + value * 0.8})`;
                    bar.style.opacity = `${0.3 + value * 0.7}`;
                });
                
                // Update waveform progress
                if (audio.duration) {
                    const progressPercent = (audio.currentTime / audio.duration) * 100;
                    waveformProgress.style.width = `${progressPercent}%`;
                }
                
                animationId = requestAnimationFrame(updateVisualizer);
            }
            
            function cancelVisualizer() {
                cancelAnimationFrame(animationId);
                visualizerBars.forEach(bar => {
                    bar.style.transform = 'scaleY(0.2)';
                    bar.style.opacity = '0.3';
                });
                waveformProgress.style.width = '0%';
            }
            
            function setTheme(theme) {
                document.documentElement.className = `theme-${theme}`;
                localStorage.setItem('musicPlayerTheme', theme);
            }
            
            function loadTheme() {
                const savedTheme = localStorage.getItem('musicPlayerTheme') || 'default';
                setTheme(savedTheme);
            }
            
            function setLoading(state) {
                playerContainer.classList.toggle('loading', state);
            }
            
            // Toggle play/pause
            function togglePlay() {
                if (songs.length === 0) return showNotification('Add some songs first!');
                
                if (isPlaying) {
                    audio.pause();
                    playBtn.innerHTML = '<i class="fas fa-play"></i>';
                    playerContainer.classList.remove('playing');
                } else {
                    audio.play()
                        .then(() => {
                            playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                            playerContainer.classList.add('playing');
                            if (audioContext.state === 'suspended') {
                                audioContext.resume();
                            }
                        })
                        .catch(error => {
                            console.error('Playback failed:', error);
                            showNotification('Playback failed. Please try another song.');
                        });
                }
                isPlaying = !isPlaying;
            }
            
            // Play song
            function playSong(index) {
                if (songs.length === 0) return;
                
                setLoading(true);
                const songInfo = document.querySelector('.song-info');
                songInfo.classList.add('song-change');
                
                // Flip album art animation
                albumArt.classList.add('flip');
                setTimeout(() => albumArt.classList.remove('flip'), 1000);
                
                setTimeout(() => {
                    currentSongIndex = index;
                    const song = songs[index];
                    
                    audio.src = song.url;
                    audio.play()
                        .then(() => {
                            isPlaying = true;
                            playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                            playerContainer.classList.add('playing');
                            updateSongInfo();
                            updatePlaylistUI();
                            songInfo.classList.remove('song-change');
                            setLoading(false);
                            
                            if (audioContext.state === 'suspended') {
                                audioContext.resume();
                            }
                        })
                        .catch(error => {
                            console.error('Playback failed:', error);
                            showNotification('Playback failed. Please try another song.');
                            songInfo.classList.remove('song-change');
                            setLoading(false);
                        });
                }, 300);
            }
            
            // Previous song
            function prevSong() {
                if (songs.length === 0) return;
                
                currentSongIndex = (currentSongIndex - 1 + songs.length) % songs.length;
                playSong(currentSongIndex);
            }
            
            // Next song
            function nextSong() {
                if (songs.length === 0) return;
                
                if (isRepeated) {
                    playSong(currentSongIndex);
                } else {
                    currentSongIndex = (currentSongIndex + 1) % songs.length;
                    playSong(currentSongIndex);
                }
            }
            
            function handleSongEnd() {
                if (isRepeated) {
                    playSong(currentSongIndex);
                } else {
                    nextSong();
                }
            }
            
            function toggleShuffle() {
                isShuffled = !isShuffled;
                shuffleBtn.classList.toggle('active', isShuffled);
                
                if (isShuffled) {
                    originalPlaylistOrder = [...songs];
                    shuffleArray(songs);
                    updatePlaylistUI();
                    showNotification('Playlist shuffled');
                } else {
                    if (originalPlaylistOrder.length > 0) {
                        songs = [...originalPlaylistOrder];
                        updatePlaylistUI();
                        showNotification('Playlist order restored');
                    }
                }
            }
            
            function toggleRepeat() {
                isRepeated = !isRepeated;
                repeatBtn.classList.toggle('active', isRepeated);
                showNotification(isRepeated ? 'Repeat: ON' : 'Repeat: OFF');
            }
            
            function shuffleArray(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
                return array;
            }
            
            // Set volume
            function setVolume() {
                audio.volume = volumeSlider.value;
                if (audio.volume === 0) {
                    volumeIcon.className = 'fas fa-volume-mute';
                } else if (audio.volume < 0.5) {
                    volumeIcon.className = 'fas fa-volume-down';
                } else {
                    volumeIcon.className = 'fas fa-volume-up';
                }
            }
            
            // Update progress bar
            function updateProgress() {
                const { duration, currentTime } = audio;
                const progressPercent = (currentTime / duration) * 100 || 0;
                progressFill.style.width = `${progressPercent}%`;
                
                currentTimeEl.textContent = formatTime(currentTime);
                if (duration) {
                    durationEl.textContent = formatTime(duration);
                }
            }
            
            // Set progress bar on click
            function setProgress(e) {
                if (!audio.duration) return;
                
                const width = this.clientWidth;
                const clickX = e.offsetX;
                const duration = audio.duration;
                audio.currentTime = (clickX / width) * duration;
            }
            
            function showProgressThumb(e) {
                if (!audio.duration) return;
                
                const width = this.clientWidth;
                const clickX = e.offsetX;
                const percent = (clickX / width) * 100;
                progressThumb.style.left = `${percent}%`;
                progressThumb.style.opacity = '1';
            }
            
            function hideProgressThumb() {
                progressThumb.style.opacity = '0';
            }
            
            // Update song info
            function updateSongInfo() {
                if (songs.length === 0) return;
                
                const currentSong = songs[currentSongIndex];
                songTitle.textContent = currentSong.name;
                artistEl.textContent = currentSong.artist || 'Unknown Artist';
                albumEl.textContent = currentSong.album || 'Unknown Album';
                
                if (currentSong.file) {
                    extractMetadata(currentSong.file);
                }
                
                document.title = `${currentSong.name} - AJ MUSIQ FACTORY`;
            }
            
            function extractMetadata(file) {
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    const arrayBuffer = e.target.result;
                    
                    try {
                        if (file.type === 'audio/mpeg') {
                            const tags = ID3.parse(arrayBuffer);
                            if (tags.TIT2) songs[currentSongIndex].name = tags.TIT2;
                            if (tags.TPE1) songs[currentSongIndex].artist = tags.TPE1;
                            if (tags.TALB) songs[currentSongIndex].album = tags.TALB;
                            
                            if (tags.APIC) {
                                const blob = new Blob([tags.APIC.data], {type: tags.APIC.format});
                                const url = URL.createObjectURL(blob);
                                albumArt.src = url;
                                // Update thumbnail in playlist
                                updatePlaylistThumbnail(currentSongIndex, url);
                            }
                            
                            updateSongInfo();
                        }
                    } catch (e) {
                        console.log('Metadata parsing failed, using default info');
                    }
                };
                
                reader.readAsArrayBuffer(file);
            }
            
            // Handle file upload
            function handleFileUpload(e) {
                const files = Array.from(e.target.files);
                
                if (files.length === 0) return;
                
                files.forEach(file => {
                    if (file.type.startsWith('audio/')) {
                        const song = {
                            name: file.name.replace(/\.[^/.]+$/, ""),
                            artist: 'Unknown Artist',
                            album: 'Unknown Album',
                            url: URL.createObjectURL(file),
                            file: file,
                            isFavorite: favorites.includes(file.name)
                        };
                        songs.push(song);
                        
                        addSongToPlaylist(song);
                    }
                });
                
                if (songs.length > 0 && !audio.src) {
                    playSong(0);
                }
                
                showNotification(`Added ${files.length} song(s)`);
                fileInput.value = '';
            }
            
            function addSongToPlaylist(song) {
                const li = document.createElement('li');
                li.innerHTML = `
                    <div class="song-info-container">
                        <img src="assets/AJLOGO.jpg" class="song-thumbnail" data-index="${songs.length - 1}">
                        <div class="song-details">
                            <div class="song-name">${song.name}</div>
                            <div class="song-artist">${song.artist || 'Unknown Artist'}</div>
                        </div>
                    </div>
                    <div class="song-controls">
                        <button class="favorite-btn ${song.isFavorite ? 'favorited' : ''}" data-index="${songs.length - 1}">
                            <i class="fas fa-star"></i>
                        </button>
                        <span class="song-duration">0:00</span>
                    </div>
                `;
                li.addEventListener('click', (e) => {
                    // Don't trigger if clicking on favorite button
                    if (!e.target.closest('.favorite-btn')) {
                        const index = parseInt(li.querySelector('.song-thumbnail').dataset.index);
                        playSong(index);
                    }
                });
                
                // Add favorite button event
                const favoriteBtn = li.querySelector('.favorite-btn');
                favoriteBtn.addEventListener('click', toggleFavorite);
                
                playlistEl.appendChild(li);
            }
            
            function updatePlaylistThumbnail(index, url) {
                const thumbnails = document.querySelectorAll('.song-thumbnail');
                if (thumbnails[index]) {
                    thumbnails[index].src = url;
                }
            }
            
            function toggleFavorite(e) {
                e.stopPropagation();
                const index = parseInt(this.dataset.index);
                songs[index].isFavorite = !songs[index].isFavorite;
                
                if (songs[index].isFavorite) {
                    if (!favorites.includes(songs[index].file.name)) {
                        favorites.push(songs[index].file.name);
                    }
                } else {
                    favorites = favorites.filter(name => name !== songs[index].file.name);
                }
                
                localStorage.setItem('favorites', JSON.stringify(favorites));
                this.classList.toggle('favorited');
                
                if (currentSort === 'favorites') {
                    sortPlaylist({ target: { dataset: { sort: 'favorites' } } });
                }
            }
            
            function loadFavorites() {
                // This will be used when loading songs to mark favorites
            }
            
            function clearPlaylist() {
                if (songs.length === 0) return;
                
                if (confirm('Are you sure you want to clear the playlist?')) {
                    songs = [];
                    playlistEl.innerHTML = '';
                    audio.src = '';
                    isPlaying = false;
                    playBtn.innerHTML = '<i class="fas fa-play"></i>';
                    playerContainer.classList.remove('playing');
                    songTitle.textContent = 'No song selected';
                    artistEl.textContent = 'Artist';
                    albumEl.textContent = 'Album';
                    albumArt.src = 'assets/AJLOGO.jpg';
                    currentTimeEl.textContent = '0:00';
                    durationEl.textContent = '0:00';
                    progressFill.style.width = '0%';
                    showNotification('Playlist cleared');
                }
            }
            
            // Update playlist UI
            function updatePlaylistUI() {
                const items = playlistEl.querySelectorAll('li');
                items.forEach((item, index) => {
                    const thumbnail = item.querySelector('.song-thumbnail');
                    thumbnail.dataset.index = index;
                    
                    const favoriteBtn = item.querySelector('.favorite-btn');
                    favoriteBtn.dataset.index = index;
                    favoriteBtn.classList.toggle('favorited', songs[index].isFavorite);
                    
                    item.classList.toggle('playing', index === currentSongIndex);
                    
                    if (songs[index] && audio.duration) {
                        const durationEl = item.querySelector('.song-duration');
                        durationEl.textContent = formatTime(audio.duration);
                    }
                });
            }
            
            function toggleModal(modal) {
                modal.classList.toggle('active');
                
                if (modal === lyricsModal && modal.classList.contains('active')) {
                    lyricsText.textContent = "Lyrics for this song are not available.\n\nThis is a demo player. In a real application, you would integrate with a lyrics API or parse lyric files.";
                }
            }
            
            function setSleepTimer(e) {
                const minutes = parseInt(e.target.dataset.minutes);
                if (isNaN(minutes)) return;
                
                // Clear existing timer
                cancelSleepTimer();
                
                const ms = minutes * 60 * 1000;
                sleepTimer = setTimeout(() => {
                    audio.pause();
                    isPlaying = false;
                    playBtn.innerHTML = '<i class="fas fa-play"></i>';
                    playerContainer.classList.remove('playing');
                    showNotification(`Sleep timer stopped playback after ${minutes} minutes`);
                }, ms);
                
                // Update UI
                timerOptions.forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');
                toggleModal(sleepTimerModal);
                showNotification(`Sleep timer set for ${minutes} minutes`);
            }
            
            function cancelSleepTimer() {
                if (sleepTimer) {
                    clearTimeout(sleepTimer);
                    sleepTimer = null;
                    timerOptions.forEach(btn => btn.classList.remove('active'));
                    showNotification('Sleep timer canceled');
                }
            }
            
            function setEqualizerPreset(e) {
                const preset = e.target.dataset.preset;
                // In a real app, this would adjust the audio equalizer
                equalizerPresets.forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');
                toggleModal(equalizerModal);
                showNotification(`Equalizer preset: ${preset}`);
            }
            
            function sortPlaylist(e) {
                const sortBy = e.target.dataset.sort;
                currentSort = sortBy;
                
                // Update UI
                sortButtons.forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');
                
                if (sortBy === 'title') {
                    songs.sort((a, b) => a.name.localeCompare(b.name));
                } else if (sortBy === 'artist') {
                    songs.sort((a, b) => (a.artist || 'Unknown').localeCompare(b.artist || 'Unknown'));
                } else if (sortBy === 'duration') {
                    // Note: This would require knowing the duration in advance
                    // In a real app, you'd need to load the duration first
                    songs.sort((a, b) => (a.duration || 0) - (b.duration || 0));
                } else if (sortBy === 'favorites') {
                    songs.sort((a, b) => (b.isFavorite ? 1 : 0) - (a.isFavorite ? 1 : 0));
                }
                
                // Rebuild playlist
                playlistEl.innerHTML = '';
                songs.forEach((song, index) => {
                    const li = document.createElement('li');
                    li.innerHTML = `
                        <div class="song-info-container">
                            <img src="${song.thumbnail || 'assets/AJLOGO.jpg'}" class="song-thumbnail" data-index="${index}">
                            <div class="song-details">
                                <div class="song-name">${song.name}</div>
                                <div class="song-artist">${song.artist || 'Unknown Artist'}</div>
                            </div>
                        </div>
                        <div class="song-controls">
                            <button class="favorite-btn ${song.isFavorite ? 'favorited' : ''}" data-index="${index}">
                                <i class="fas fa-star"></i>
                            </button>
                            <span class="song-duration">${song.duration ? formatTime(song.duration) : '0:00'}</span>
                        </div>
                    `;
                    li.addEventListener('click', (e) => {
                        if (!e.target.closest('.favorite-btn')) {
                            playSong(index);
                        }
                    });
                    
                    const favoriteBtn = li.querySelector('.favorite-btn');
                    favoriteBtn.addEventListener('click', toggleFavorite);
                    
                    playlistEl.appendChild(li);
                });
                
                // Highlight current playing song
                updatePlaylistUI();
                showNotification(`Playlist sorted by ${sortBy}`);
            }
            
            function shareOnTwitter() {
                if (songs.length === 0) return;
                const song = songs[currentSongIndex];
                const text = `I'm listening to "${song.name}" by ${song.artist || 'Unknown Artist'} on AJ MUSIQ FACTORY!`;
                window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`, '_blank');
            }
            
            function shareOnFacebook() {
                if (songs.length === 0) return;
                const song = songs[currentSongIndex];
                const text = `I'm listening to "${song.name}" by ${song.artist || 'Unknown Artist'} on AJ MUSIQ FACTORY!`;
                window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(window.location.href)}&quote=${encodeURIComponent(text)}`, '_blank');
            }
            
            function copySongLink() {
                if (songs.length === 0) return;
                const song = songs[currentSongIndex];
                navigator.clipboard.writeText(`Check out "${song.name}" by ${song.artist || 'Unknown Artist'} on AJ MUSIQ FACTORY!`)
                    .then(() => showNotification('Link copied to clipboard!'))
                    .catch(() => showNotification('Failed to copy link'));
            }
            
            function showNotification(message) {
                const notification = document.createElement('div');
                notification.className = 'notification';
                notification.textContent = message;
                document.body.appendChild(notification);
                
                setTimeout(() => {
                    notification.classList.add('show');
                }, 10);
                
                setTimeout(() => {
                    notification.classList.remove('show');
                    setTimeout(() => {
                        document.body.removeChild(notification);
                    }, 300);
                }, 3000);
            }
            
            function formatTime(seconds) {
                if (isNaN(seconds)) return '0:00';
                
                const minutes = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${minutes}:${secs < 10 ? '0' : ''}${secs}`;
            }
            
            // Initialize the player
            initPlayer();
        });
    </script>
</body>
</html>
